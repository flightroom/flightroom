# Needs the group (or project) CI/CD variable FLIGHTROOM_API_KEY, created by the console.
stages:
  - test
  - build
  - deploy

variables:
  NODE_VERSION: "24"

# pnpm comes from the packageManager field of package.json, through corepack
.pnpm:
  image: node:${NODE_VERSION}
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

build:
  extends: .pnpm
  stage: build
  script:
    - pnpm run build
    - echo "Build completed successfully"
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH =~ /^(main|develop|development)$/

deploy:
  stage: deploy
  image: alpine:3
  needs:
    - build
  variables:
    MICROFRONTEND_SLUG: "%microfrontendSlug%"
    # Base URL of your orchestrator console. Set a project CI/CD variable of the
    # same name to publish to a different installation.
    MICROFRONTEND_ORCHESTRATOR_DOMAIN: "%domain%"
  before_script:
    - apk add --no-cache curl zip
  script:
    - cd dist && zip -qr ../dist.zip . && cd ..
    - |
      curl --fail-with-body --show-error --silent -X POST \
        -H "api-key: ${FLIGHTROOM_API_KEY}" \
        -F "file=@dist.zip" \
        "${MICROFRONTEND_ORCHESTRATOR_DOMAIN%/}/api/frontends/by-slug/${MICROFRONTEND_SLUG}/upload/${CI_COMMIT_TAG}"
    - echo "published ${MICROFRONTEND_SLUG} ${CI_COMMIT_TAG}"
  rules:
    - if: $CI_COMMIT_TAG
