name: 🐳 Docker Build

permissions:
  contents: read
  packages: read
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main,development]
    tags: ["*"]

env:
  IMAGE: lory1990/flightroom
  CHART_PATH: helm/flightroom
  CHART_REGISTRY: oci://ghcr.io/flightroom/charts

jobs:
  monorepo-build:
    uses: ./.github/workflows/monorepo-build.yml
    secrets: inherit

  # Lints the Helm chart on every push. On a tag it also stops the release before
  # anything is published when the tag is not on main, when the chart does not
  # ship the tagged image (appVersion != tag) or when its version is already in
  # the registry.
  helm-chart-check:
    runs-on: ubuntu-24.04

    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🌿 Check Release Tag Is On Main
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG is not on main. Releases are tagged on the main merge commit of the release PR."
            exit 1
          fi

      - name: ⎈ Setup Helm
        uses: azure/setup-helm@v5

      - name: 🔍 Lint Chart
        run: helm lint ${{ env.CHART_PATH }}

      - name: 🏷️ Check Chart Against The Release Tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          app_version=$(helm show chart ${{ env.CHART_PATH }} | sed -n 's/^appVersion: //p' | tr -d '"')
          chart_version=$(helm show chart ${{ env.CHART_PATH }} | sed -n 's/^version: //p')

          if [[ "$app_version" != "$TAG" ]]; then
            echo "::error file=${{ env.CHART_PATH }}/Chart.yaml::appVersion is $app_version but the release tag is $TAG. Set appVersion to \"$TAG\", bump version and tag again."
            exit 1
          fi

          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          if helm show chart ${{ env.CHART_REGISTRY }}/flightroom --version "$chart_version" > /dev/null 2>&1; then
            echo "::error file=${{ env.CHART_PATH }}/Chart.yaml::Chart version $chart_version is already published. Bump version in Chart.yaml and tag again."
            exit 1
          fi

  docker-build:
    needs: [monorepo-build, helm-chart-check]
    runs-on: ubuntu-24.04

    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v7

      - name: 📥 Download Backend Build
        uses: actions/download-artifact@v8
        with:
          name: backend-build
          path: backend/dist

      - name: 📥 Download Frontend Build
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: frontend/dist

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🚀 Build and Push Docker Image
        run: |
          docker build -t ${{ env.IMAGE }}:latest -f Dockerfile .

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            docker tag ${{ env.IMAGE }}:latest ${{ env.IMAGE }}:${{ github.ref_name }}
            docker push ${{ env.IMAGE }}:${{ github.ref_name }}
          else
            docker push ${{ env.IMAGE }}:latest
          fi

      # Self contained image: orchestrator + MongoDB + Redis + Nginx, so that a
      # `docker run` is enough to get a working installation.
      - name: 📦 Build and Push All-in-One Docker Image
        run: |
          docker build -t ${{ env.IMAGE }}:all-in-one -f Dockerfile.all-in-one .

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            docker tag ${{ env.IMAGE }}:all-in-one ${{ env.IMAGE }}:${{ github.ref_name }}-all-in-one
            docker push ${{ env.IMAGE }}:${{ github.ref_name }}-all-in-one
          fi

          docker push ${{ env.IMAGE }}:all-in-one

  # Publishes the chart once the image it points to exists, so that ArgoCD and
  # Helm can install it straight from the registry.
  helm-publish:
    needs: [docker-build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v7

      - name: ⎈ Setup Helm
        uses: azure/setup-helm@v5

      - name: 📦 Package And Push Chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package ${{ env.CHART_PATH }} --destination dist
          helm push dist/flightroom-*.tgz ${{ env.CHART_REGISTRY }}
