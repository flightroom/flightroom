name: 🐳 Docker Build

permissions:
  contents: read
  packages: read
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main,development]
    tags: ["*"]

env:
  IMAGE: lory1990/flightroom
  CHART_PATH: helm/flightroom
  CHART_REGISTRY: oci://ghcr.io/flightroom/charts

jobs:
  monorepo-build:
    uses: ./.github/workflows/monorepo-build.yml
    secrets: inherit

  # Lints the Helm chart on every push. On a tag it also stops the release before
  # anything is published when the tag is not on main, when the chart does not
  # ship the tagged image (appVersion != tag) or when its version is already in
  # the registry.
  helm-chart-check:
    runs-on: ubuntu-24.04

    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🌿 Check Release Tag Is On Main
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG is not on main. Releases are tagged on the main merge commit of the release PR."
            exit 1
          fi

      - name: ⎈ Setup Helm
        uses: azure/setup-helm@v5

      - name: 🔍 Lint Chart
        run: helm lint ${{ env.CHART_PATH }}

      - name: 🏷️ Check Chart Against The Release Tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          app_version=$(helm show chart ${{ env.CHART_PATH }} | sed -n 's/^appVersion: //p' | tr -d '"')
          chart_version=$(helm show chart ${{ env.CHART_PATH }} | sed -n 's/^version: //p')

          if [[ "$app_version" != "$TAG" ]]; then
            echo "::error file=${{ env.CHART_PATH }}/Chart.yaml::appVersion is $app_version but the release tag is $TAG. Set appVersion to \"$TAG\", bump version and tag again."
            exit 1
          fi

          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          if helm show chart ${{ env.CHART_REGISTRY }}/flightroom --version "$chart_version" > /dev/null 2>&1; then
            echo "::error file=${{ env.CHART_PATH }}/Chart.yaml::Chart version $chart_version is already published. Bump version in Chart.yaml and tag again."
            exit 1
          fi

  # The two images are built by parallel jobs, each with its own BuildKit cache
  # on GitHub Actions: the apt and pnpm layers are rebuilt only when the
  # Dockerfile or the lockfile change, and the unchanged layers keep their
  # digest, so the registry already has them and the push skips them.
  docker-build:
    needs: [monorepo-build, helm-chart-check]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - variant: standard
            dockerfile: Dockerfile
            # A release only gets its version tag, :latest follows development.
            rolling-tag: latest
            release-suffix: ""
            push-rolling-on-release: false
          # Self contained image: orchestrator + MongoDB + Redis + Nginx, so that
          # a `docker run` is enough to get a working installation.
          - variant: all-in-one
            dockerfile: Dockerfile.all-in-one
            rolling-tag: all-in-one
            release-suffix: -all-in-one
            push-rolling-on-release: true

    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v7

      - name: 📥 Download Backend Build
        uses: actions/download-artifact@v8
        with:
          name: backend-build
          path: backend/dist

      - name: 📥 Download Frontend Build
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: frontend/dist

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ Compute Image Tags
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          ROLLING_TAG: ${{ matrix.rolling-tag }}
          RELEASE_SUFFIX: ${{ matrix.release-suffix }}
          PUSH_ROLLING_ON_RELEASE: ${{ matrix.push-rolling-on-release }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            tags="${{ env.IMAGE }}:${REF_NAME}${RELEASE_SUFFIX}"
            if [[ "$PUSH_ROLLING_ON_RELEASE" == "true" ]]; then
              tags="$tags,${{ env.IMAGE }}:${ROLLING_TAG}"
            fi
          else
            tags="${{ env.IMAGE }}:${ROLLING_TAG}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      # The default `docker` driver cannot export the cache to GitHub Actions:
      # a docker-container builder is needed for `type=gha`.
      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # `context: .` is required: the default Git context would not contain the
      # frontend and backend builds downloaded above.
      - name: 🚀 Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # The backend installs @nvidia/openshell-sdk from GitHub Packages.
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max

  # Publishes the chart once the image it points to exists, so that ArgoCD and
  # Helm can install it straight from the registry.
  helm-publish:
    needs: [docker-build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v7

      - name: ⎈ Setup Helm
        uses: azure/setup-helm@v5

      - name: 📦 Package And Push Chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package ${{ env.CHART_PATH }} --destination dist
          helm push dist/flightroom-*.tgz ${{ env.CHART_REGISTRY }}
