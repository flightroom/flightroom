apiVersion: v2
name: flightroom
# The name feeds the immutable Deployment selector (app.kubernetes.io/name) and the resource names:
# 0.3.0 renamed it from mfe-orchestrator, see the README for the upgrade of an existing release.
description: Flightroom - JSON based configuration, versioning and multi-environment delivery of frontends
type: application

# Chart version: the Flightroom release it ships, the same as appVersion (0.3.14 was the last
# chart versioned on its own, with 9.0.0).
version: 9.1.0
# Version of the Flightroom image shipped by default (see values.yaml image.tag).
# The release workflow fails on a tag that does not match it or version: bump both before tagging.
appVersion: "9.1.0"

home: https://github.com/flightroom/flightroom
sources:
  - https://github.com/flightroom/flightroom
icon: https://raw.githubusercontent.com/flightroom/flightroom/main/frontend/public/favicon.ico

keywords:
  - frontend
  - microfrontends
  - module-federation
  - deployment

maintainers:
  - name: flightroom
    url: https://github.com/flightroom

annotations:
  category: DeveloperTools
  licenses: Apache-2.0
