apiVersion: v2
name: mfe-orchestrator
# NOTE: chart name and the "mfe-orchestrator.*" helpers are kept on purpose: the name feeds the immutable Deployment selector (app.kubernetes.io/name) and the resource names.
description: Flightroom - JSON based configuration, versioning and multi-environment delivery of frontends
type: application

# Chart version: bumped on every change to the chart itself.
version: 0.2.0
# Version of the Flightroom image shipped by default (see values.yaml image.tag).
appVersion: "4.0.0"

home: https://github.com/flightroom/flightroom
sources:
  - https://github.com/flightroom/flightroom
icon: https://raw.githubusercontent.com/flightroom/flightroom/main/frontend/public/favicon.ico

keywords:
  - frontend
  - orchestrator
  - module-federation
  - frontend

maintainers:
  - name: flightroom
    url: https://github.com/flightroom

annotations:
  category: DeveloperTools
  licenses: Apache-2.0
